name: Copy Crazy Cattle 3D Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Crazy Cattle 3D source repository
        run: |
          # Clones the main branch with minimal history depth to save bandwidth
          git clone --depth 1 https://github.com/genizy/cc3d-mobile temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/crazy-cattle-3d
          
          # Safely migrates files from the root while stripping upstream git metadata
          rsync -av --exclude='.git' temp-repo/ games/crazy-cattle-3d/

      - name: Remove Base Line in Index
        run: |
          INDEX_FILES=$(find games/crazy-cattle-3d -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/d' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/crazy-cattle-3d!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          # Configured with the official GitHub Actions identity credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the new game files directly
          git add games/crazy-cattle-3d/
          
          # Create the commit locally
          git commit -m "Imported Crazy Cattle 3D web assets directly via standard web sync" || echo "No changes to commit"
          
          # Fetch remote changes and place our new commit cleanly at the front of the line
          git pull --rebase origin main
          
          # Push the files up so they appear instantly on your GitHub Web interface
          git push origin main
