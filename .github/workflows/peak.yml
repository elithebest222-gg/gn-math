name: Copy Pikuniku Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Pikuniku source repository
        run: |
          # Clones the pikuniku web port repository with minimal history depth
          git clone --depth 1 https://github.com/larpinguser/pikuniku temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/pikuniku
          
          # Migrates the core assets directly into the target game folder
          if [ -d "temp-repo" ]; then
            rsync -av --exclude='.git' temp-repo/ games/pikuniku/
          else
            echo "::error::Source repository folder temp-repo not found!"
            exit 1
          fi

      - name: Remove Base Line in Index (Case Insensitive)
        run: |
          INDEX_FILES=$(find games/pikuniku -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              # Strips out any case variation of the base href tag
              sed -i '/<base href=/Id' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/pikuniku!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          # Configured with the official GitHub Actions identity credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the new game files directly
          git add games/pikuniku/
          
          # Create the commit locally
          git commit -m "Imported Pikuniku web assets directly via standard web sync" || echo "No changes to commit"
          
          # Fetch remote changes and place our new commit cleanly at the front of the line
          git pull --rebase origin main
          
          # Push the files up to update your repository
          git push origin main
