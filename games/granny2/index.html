<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Granny: Chapter 2</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <style>
      body {
        cursor: url('Cursor.png'), auto;
        background-color: black;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #unityContainer {
        width: 100vw !important;
        height: 100vh !important;
      }
      canvas {
        width: 100% !important;
        height: 100% !important;
      }

      /* Centered loading overlay */
      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        transition: opacity 0.5s ease;
      }

      /* Rainbow Text */
      #loading-text {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 20px;
        background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
      }

      /* Progress Bar Container */
      #progress-container {
        width: 80%;
        max-width: 500px;
        height: 20px;
        background-color: #222;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #444;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
      }

      /* Active Progress Fill */
      #progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ff0000, #ff7f00);
        border-radius: 10px;
        transition: width 0.1s ease;
      }

      /* Subtext for MB metrics */
      #loading-metrics {
        color: #888;
        font-size: 16px;
        margin-top: 10px;
        font-weight: 500;
      }

      /* New Error Box Popup */
      #error-box {
        display: none;
        background-color: #1a0505;
        border: 2px solid #ff3333;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
        width: 80%;
        max-width: 600px;
        color: #ffcccc;
        text-align: left;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      }
      #error-box h3 {
        margin-top: 0;
        color: #ff4444;
      }
      #error-details {
        font-family: monospace;
        background: #000;
        padding: 10px;
        border-radius: 4px;
        overflow-x: auto;
        white-space: pre-wrap;
      }

      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body>
    <!-- Structured Loading UI -->
    <div id="loading-overlay">
      <div id="loading-text">LOADING GRANNY 2</div>
      <div id="progress-container">
        <div id="progress-fill"></div>
      </div>
      <div id="loading-metrics">0.00 MB / 0.00 MB (0%)</div>
      
      <!-- New Error Element -->
      <div id="error-box">
        <h3>🚨 Game Crash / Download Error Detour</h3>
        <p>An issue blocked the game from initializing. Details below:</p>
        <div id="error-details">No errors detected yet...</div>
      </div>
    </div>

    <div class="webgl-content">
      <div id="unityContainer"></div>
    </div>

    <script>
      const loadingOverlay = document.querySelector("#loading-overlay");
      const progressFill = document.querySelector("#progress-fill");
      const loadingMetrics = document.querySelector("#loading-metrics");
      const errorBox = document.querySelector("#error-box");
      const errorDetails = document.querySelector("#error-details");
      
      let partProgress = {};
      const totalTargetBytes = 304.68 * 1024 * 1024; 

      // Visual helper to pop out crash summaries onto the screen
      function displayScreenError(message) {
        errorBox.style.display = "block";
        errorDetails.textContent = message;
        progressFill.style.background = "#ff3333";
        loadingMetrics.style.color = "#ff4444";
        loadingMetrics.textContent = "Download Halted due to Error.";
      }

      // Intercept any general script bugs or unhandled promise problems
      window.addEventListener('error', function(e) {
        displayScreenError(`Script Error: ${e.message}\nAt: ${e.filename}:${e.lineno}`);
      });
      window.addEventListener('unhandledrejection', function(e) {
        displayScreenError(`Promise Rejected: ${e.reason}`);
      });

      function updateOverallUI() {
        let overallLoaded = 0;
        let overallTotal = 0;

        for (let key in partProgress) {
          overallLoaded += partProgress[key].loaded;
          overallTotal += partProgress[key].total;
        }

        if (overallTotal === 0) overallTotal = totalTargetBytes;

        let mbDone = (overallLoaded / (1024 * 1024)).toFixed(2);
        let mbTotal = (overallTotal / (1024 * 1024)).toFixed(2);
        let percentage = Math.min(((overallLoaded / overallTotal) * 100), 100).toFixed(0);

        progressFill.style.width = `${percentage}%`;
        loadingMetrics.textContent = `${mbDone} MB / ${mbTotal} MB (${percentage}%)`;
      }

      async function fetchWithProgress(url) {
        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status} - Server could not find file part: "${url}"`);
          }
          
          const contentLength = +response.headers.get('Content-Length') || (totalTargetBytes / 16);
          partProgress[url] = { loaded: 0, total: contentLength };

          const reader = response.body.getReader();
          let chunks = [];
          let received = 0;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            received += value.length;
            partProgress[url].loaded = received;
            chunks.push(value);

            updateOverallUI();
          }

          let fullBuffer = new Uint8Array(received);
          let offset = 0;
          for (let chunk of chunks) {
            fullBuffer.set(chunk, offset);
            offset += chunk.length;
          }
          return fullBuffer.buffer;
        } catch (err) {
          displayScreenError(`Download Failed:\n${err.message}`);
          throw err;
        }
      }

      async function mergeFiles(fileParts, cacheKey) {
        try {
          const cache = await caches.open("granny2-cache");
          const cachedResponse = await cache.match(cacheKey);
          
          if (cachedResponse) {
            progressFill.style.width = "100%";
            loadingMetrics.textContent = "304.68 MB / 304.68 MB (100%)";
            const blob = await cachedResponse.blob();
            return URL.createObjectURL(blob);
          }

          const buffers = await Promise.all(
            fileParts.map(part => fetchWithProgress(part))
          );
          const mergedBlob = new Blob(buffers);
          const response = new Response(mergedBlob);
          await cache.put(cacheKey, response);
          return URL.createObjectURL(mergedBlob);
        } catch (err) {
          displayScreenError(`Merging Error:\n${err.message}`);
          throw err;
        }
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }

      (async () => {
        try {
          // Step 1: Piece split data files together
          const [dataUrl] = await Promise.all([
            mergeFiles(getParts("Build/Granny2.data.unityweb", 1, 16), "Granny2.data.unityweb"),
          ]);

          const originalOpen = XMLHttpRequest.prototype.open;
          const originalSend = XMLHttpRequest.prototype.send;

          XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            this._requestUrl = url;
            if (url.includes("Granny2.data.unityweb")) {
              url = dataUrl;
            }
            this._modifiedUrl = url;
            return originalOpen.call(this, method, url, ...rest);
          };

          XMLHttpRequest.prototype.send = function (...args) {
            if (this._requestUrl && (this._requestUrl.includes(".wasm") || this._requestUrl.includes(".js"))) {
              this.addEventListener("loadend", () => {
                // If there's an error on screen, don't hide the overlay
                if (errorBox.style.display !== "block") {
                  loadingOverlay.style.opacity = "0";
                  setTimeout(() => {
                    loadingOverlay.style.display = "none";
                  }, 500);
                }
              });
            }
            return originalSend.apply(this, args);
          };

          // Step 2: Boot Unity
          if (typeof UnityLoader === "undefined") {
            throw new Error("UnityLoader is missing. Check if 'Build/UnityLoader.js' path is correct.");
          }
          var unityInstance = UnityLoader.instantiate("unityContainer", "Build/Granny2.json", {onProgress: UnityProgress});
        } catch (err) {
          displayScreenError(`Initialization Error:\n${err.message}`);
        }
      })();
    </script>
  </body>
</html>
