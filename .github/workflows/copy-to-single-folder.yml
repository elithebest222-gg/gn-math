name: Copy Speed Stars 2 Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Keeps large file storage layers active

      - name: Clone Speed Stars 2 source repository
        run: |
          # Clones the master repository containing the nested game asset paths
          git clone --depth 1 https://github.com/zz98006/speed-stars2 temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/speed-stars-2
          
          # Safely migrates files from the subfolder while stripping upstream git metadata
          if [ -d "temp-repo/speed-stars" ]; then
            rsync -av --exclude='.git' temp-repo/speed-stars/ games/speed-stars-2/
          else
            rsync -av --exclude='.git' temp-repo/ games/speed-stars-2/
          fi

      - name: Remove Base Line in Index
        run: |
          INDEX_FILES=$(find games/speed-stars-2 -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/d' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/speed-stars-2!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely with LFS tracking
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Initialize LFS system controls inside the local runner
          git lfs install
          
          # Protect high-capacity binary files from crashing standard Git limits
          git lfs track "games/speed-stars-2/Build/*.data"
          git lfs track "games/speed-stars-2/Build/*.wasm"
          git lfs track "games/speed-stars-2/Build/*.bundle"
          git lfs track "*.data"
          git lfs track "*.wasm"
          
          git add .gitattributes
          git add games/speed-stars-2/
          
          git commit -m "Imported Speed Stars 2 assets with robust LFS tracking rules" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
