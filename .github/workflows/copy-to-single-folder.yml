name: Copy Files to games-buckshot
on:
  workflow_dispatch: # This adds the manual "Run" button

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone your source game repository
        run: |
          git clone --depth 1 https://github.com temp-game

      - name: Move files directly into games/Buckshot
        run: |
          # Creates the nested folder structure automatically
          mkdir -p games/Buckshot
          cp -r temp-game/* games/Buckshot/
          rm -rf temp-game

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add games/Buckshot/
          git commit -m "Successfully moved all 37+ game files into games/Buckshot" || echo "No changes"
          git push
