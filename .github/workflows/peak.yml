      - name: Debug folder sizes
        run: |
          echo "=== Top level sizes ==="
          du -h --max-depth=1 . | sort -h
          
          echo "=== Inspecting build output directory ==="
          # Replace './dist' with your actual build/public directory
          du -h --max-depth=2 ./dist | sort -h 

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
