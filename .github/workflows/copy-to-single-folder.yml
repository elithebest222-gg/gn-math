name: Copy Celeste Game
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Celeste source repository
        run: |
          git clone --depth 1 https://github.com/web-ports/celeste temp-repo

      - name: Verify and Move Web Frame Assets
        run: |
          # Create destination directory structure
          mkdir -p games/celeste
          
          # CRITICAL CHECK: Verify core framework and web engine dependencies exist
          if [ ! -d "temp-repo/_framework" ] || [ ! -f "temp-repo/bundle.js" ] || [ ! -f "temp-repo/index.html" ]; then
            echo "::error::Core compilation files (_framework/, bundle.js, or index.html) were not found in the source!"
            exit 1
          fi

          # Copy framework bundles, assets, styles, and web indexes
          cp -r temp-repo/* games/celeste/
          
          # Remove Git metadata from the copied directory if any slipped through
          rm -rf games/celeste/.git
          
          # Clean up the temporary workspace clone
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add games/celeste/
          git commit -m "Successfully imported Celeste web port framework and assets" || echo "No changes to commit"
          
          # Rebase onto your main branch to sync any concurrent repository modifications
          git pull --rebase origin main
          git push origin main
