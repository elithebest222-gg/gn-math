name: Copy DogeMiner Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone DogeMiner source repository
        run: |
          # Clones only the specific 'fixy' branch to save bandwidth
          git clone --branch fixy --depth 1 https://github.com/Nailington/3kh0-assets temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/dogeminer
          
          # Isolate and migrate just the DogeMiner subdirectory assets
          rsync -av --exclude='.git' temp-repo/DogeMiner/ games/dogeminer/

      - name: Remove Base Line in Index
        run: |
          TARGET_INDEX="games/dogeminer/index.html"
          
          if [ -f "$TARGET_INDEX" ]; then
            # Strips out any variation of the <base href=... > tag securely
            sed -i '/<base href=/d' "$TARGET_INDEX"
            echo "Successfully removed base href tags from $TARGET_INDEX"
          else
            echo "::error::index.html not found at $TARGET_INDEX! Verify target repository structure."
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add games/dogeminer/
          git commit -m "Imported DogeMiner assets and stripped base line from index.html" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
