<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hobo Flash Game</title>
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: #000; /* Keeps screen clean while loading */
            }
            #ruffle-container {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="ruffle-container"></div>
        
        <!-- Config declared BEFORE ruffle.js loads -->
        <script>
            window.RufflePlayer = window.RufflePlayer || {};
            window.RufflePlayer.config = {
                "publicPath": "./",
                "autoplay": "on",
                "unmuteOverlay": "hidden"
            };
        </script>

        <!-- Loads your local ruffle.js file -->
        <script src="ruffle.js"></script>
        
        <script>
            // Wait for the window to finish loading the DOM and Ruffle framework
            window.addEventListener("load", function() {
                var ruffle = window.RufflePlayer.newest();
                if (!ruffle) {
                    console.error("Ruffle engine was not detected.");
                    return;
                }

                // Initialize the Flash Player
                var player = ruffle.createPlayer();
                
                player.style.width = '100%';
                player.style.height = '100%';

                // Target your container div
                var container = document.getElementById('ruffle-container');
                container.appendChild(player);

                // Load your uploaded SWF file directly from the root folder
                player.load({ url: 'Hobo.swf' });
            });
        </script>
    </body>
</html>
