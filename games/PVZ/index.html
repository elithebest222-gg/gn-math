<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Plants vs. Zombies - Direct Local</title>
  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: cursive, sans-serif;
    }

    #loading-text {
      font-weight: bold;
      background: linear-gradient(
        270deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #00ff00,
        #0000ff,
        #4b0082,
        #8f00ff
      );
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 3s ease infinite;
      font-size: 48px;
      text-align: center;
      margin-top: 20px;
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <div id="loading-text">LOADING...</div>
  <canvas id="canvas" width="800" height="600" style="display:block; outline:0"></canvas>

  <textarea
    id="pvz-soft-keyboard"
    style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; font-size:16px"
    autocapitalize="off"
    autocomplete="off"
    autocorrect="off"
    enterkeyhint="done"
    spellcheck="false"
  ></textarea>

  <script>
    let _res, _rej;
    window.moduleReadyPromise = new Promise((r, e) => { _res = r; _rej = e; });

    var Module = {
      canvas: document.getElementById("canvas"),
      noInitialRun: true,
      onRuntimeInitialized: _res,
      onAbort: function(e) {
        console.error("Module aborted:", e);
        document.getElementById("loading-text").textContent = "CRASH: WebAssembly Aborted";
        _rej(e);
      },
      print: console.log,
      printErr: console.warn,
      locateFile: function(path, prefix) {
        if (path.endsWith(".wasm")) return "pvz.wasm";
        return prefix + path;
      }
    };
  </script>

  <script>
    const loadingText = document.querySelector("#loading-text");
    let loadedBytes = 0;

    // Reads the chunks sequentially and monitors data throughput progress
    async function fetchWithProgress(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status} - Missing: ${url}`);
      }
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        loadingText.textContent = `LOADING... ${mbDone} MB / 43.34 MB`;
      }
      
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    (async () => {
      try {
        // 1. Stream file parts cleanly without matching browser Cache Storage overrides
        loadingText.textContent = "LOADING... Fetching game files...";
        const fileParts = ["main.pak.part1", "main.pak.part2", "main.pak.part3"];
        
        const buffers = await Promise.all(
          fileParts.map(part => fetchWithProgress(part))
        );
        
        const mergedBlob = new Blob(buffers);
        const pakurl = URL.createObjectURL(mergedBlob);
        
        // 2. Load script orchestrator
        let ns = document.createElement("script");
        ns.src = "pvz.js";
        ns.onerror = () => {
          loadingText.textContent = "ERROR: Cannot read 'pvz.js'";
        };
        document.body.appendChild(ns);
        await window.moduleReadyPromise;

        // 3. Virtual internal file system mapping arrays
        const files = [
          [pakurl, "main.pak"],
          ["properties/Layout.xml", "properties/Layout.xml"],
          ["properties/partner.xml.sig", "properties/partner.xml.sig"],
          ["properties/default.xml", "properties/default.xml"],
          ["properties/partner.xml", "properties/partner.xml"],
          ["properties/partner_logo.jpg", "properties/partner_logo.jpg"],
        ];

        for (const [src, dest] of files) {
          const response = await fetch(src);
          if (!response.ok) {
            loadingText.textContent = `ERROR: Missing file "properties/${dest.split('/').pop()}"`;
            return;
          }
          const data = new Uint8Array(await response.arrayBuffer());
          const parts = dest.split("/");
          let dir = "/";
          for (let i = 0; i < parts.length - 1; i++) {
            dir += (dir === "/" ? "" : "/") + parts[i];
            try { Module.FS.mkdir(dir); } catch {}
          }
          Module.FS.writeFile("/" + dest, data);
        }

        // 4. Mount saves systems
        try { Module.FS.mkdir("/saves"); } catch {}
        try { Module.FS.mount(Module.FS.filesystems.IDBFS, {}, "/saves"); } catch {}
        await new Promise(r => Module.FS.syncfs(true, r));

        // 5. Responsive scaling logic
        const c = document.getElementById("canvas");
        const resize = () => {
          const s = Math.min(innerWidth / 800, innerHeight / 600);
          c.style.width  = s * 800 + "px";
          c.style.height = s * 600 + "px";
        };
        resize();
        addEventListener("resize", resize);
        addEventListener("fullscreenchange", resize);

        const sync = () => Module.FS.syncfs(false, () => {});
        setInterval(sync, 5000);
        addEventListener("visibilitychange", () => document.hidden && sync());
        addEventListener("pagehide", sync);

        // 6. Start game engine execution loop
        Module.callMain([]);
        loadingText.remove();
        
      } catch (e) {
        console.error("Execution loop crash:", e);
        loadingText.textContent = "ERROR: Local assets blocked or incomplete. Verify server connection.";
      }
    })();
  </script>

</body>
</html>
