name: Copy Friday Night Funkin Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Friday Night Funkin source repository
        run: |
          # Clones the main branch with minimal history depth to save bandwidth
          git clone --depth 1 https://github.com/Entraptadoeztechnology/fridayfunk temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/fridayfunk
          
          # Use rsync to safely migrate files while excluding git tracking records
          rsync -av --exclude='.git' temp-repo/ games/fridayfunk/

      - name: Remove Base Line in Index
        run: |
          TARGET_INDEX="games/fridayfunk/index.html"
          
          if [ -f "$TARGET_INDEX" ]; then
            # Strips out any variation of the <base href=... > tag securely
            sed -i '/<base href=/d' "$TARGET_INDEX"
            echo "Successfully removed base href tags from $TARGET_INDEX"
          else
            echo "::error::index.html not found at $TARGET_INDEX! Verify target repository structure."
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add games/fridayfunk/
          git commit -m "Imported Friday Night Funkin assets and stripped base line from index.html" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
