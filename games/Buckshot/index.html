<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
	<title>Buckshot Roulette Multiplayer</title>
	
	<!-- 1. Fix Cross-Origin Isolation Headers via Service Worker -->
	<script src="coi-serviceworker.js"></script>

	<style>
		body {
			touch-action: none;
			margin: 0;
			border: 0 none;
			padding: 0;
			text-align: center;
			background-color: black;
		}
		#canvas {
			display: block;
			margin: 0 auto;
			color: white;
		}
		#canvas:focus {
			outline: none;
		}
		#status {
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			position: absolute;
			color: #f5f5f5;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
		}
	</style>
</head>
<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>
	<div id="status">Preparing game assets...</div>

	<!-- Load the Godot engine JavaScript wrapper -->
	<script src="GlitchesBuckshot-W-MPsupport.js"></script>
	
	<script>
		// 2. Fix paths pointing explicitly to your custom-named game files
		const GODOT_CONFIG = {
			"args": [],
			"canvasResizePolicy": 2,
			"executable": "GlitchesBuckshot-W-MPsupport", // Points to the .wasm file
			"mainPack": "GlitchesBuckshot-W-MPsupport.pck", // Points to the .pck file
			"fileSizes": {
				"GlitchesBuckshot-W-MPsupport.pck": 1, // Optional file size tracking variables
				"GlitchesBuckshot-W-MPsupport.wasm": 1
			}
		};

		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusEl = document.getElementById('status');
			
			engine.startGame({
				'onProgress': function (current, total) {
					if (total > 0) {
						statusEl.textContent = `Loading: ${Math.floor((current / total) * 100)}%`;
					} else {
						statusEl.textContent = "Loading...";
					}
				}
			}).then(() => {
				statusEl.style.display = 'none';
			}).catch((err) => {
				statusEl.textContent = "An error occurred loading the engine.";
				console.error(err);
			});
		})();
	</script>
</body>
</html>
