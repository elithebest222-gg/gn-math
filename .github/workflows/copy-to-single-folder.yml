name: Copy Fish Game
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone the fish port repository
        run: |
          # Shallow clone the repository to quickly download files
          git clone --depth 1 https://github.com/web-ports/fish temp-repo

      - name: Verify and Move Fish Build Assets
        run: |
          # Create target directory
          mkdir -p games/fish
          
          # CRITICAL CHECK: Verify /Build, /TemplateData and index.html all exist
          if [ ! -d "temp-repo/Build" ] || [ ! -d "temp-repo/TemplateData" ] || [ ! -f "temp-repo/index.html" ]; then
            echo "::error::Required files (/Build, /TemplateData, or index.html) were not found in the source!"
            exit 1
          fi

          # Explicitly copy the core game build engine and templates
          cp -r temp-repo/Build/ games/fish/Build/
          cp -r temp-repo/TemplateData/ games/fish/TemplateData/
          cp temp-repo/index.html games/fish/index.html
          
          # Clean hardcoded base elements if they exist to prevent asset loading breaks
          if [ -f games/fish/index.html ]; then
            sed -i '/<base href=/d' games/fish/index.html
          fi
          
          # Clean up temp working repository
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add games/fish/
          git commit -m "Successfully imported Fish game assets including /Build folder" || echo "No changes to commit"
          
          # Rebase onto your main branch to sync any incoming commits
          git pull --rebase origin main
          git push origin main
