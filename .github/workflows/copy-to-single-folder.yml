name: Copy Schoolboy Runaway Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Schoolboy Runaway source repository
        run: |
          # Clones the main branch with minimal history depth to save bandwidth
          git clone --depth 1 https://github.com/giorgirick2-gif/game-webports-onawebsite temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/schoolboy-runaway
          
          # Isolate and migrate just the schoolboy-runaway subdirectory assets
          rsync -av --exclude='.git' temp-repo/schoolboy-runaway/ games/schoolboy-runaway/

      - name: Remove Base Line in Index
        run: |
          TARGET_INDEX="games/schoolboy-runaway/index.html"
          
          if [ -f "$TARGET_INDEX" ]; then
            # Strips out any variation of the <base href=... > tag securely
            sed -i '/<base href=/d' "$TARGET_INDEX"
            echo "Successfully removed base href tags from $TARGET_INDEX"
          else
            echo "::error::index.html not found at $TARGET_INDEX! Verify target repository structure."
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add games/schoolboy-runaway/
          git commit -m "Imported Schoolboy Runaway assets and stripped base line from index.html" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
