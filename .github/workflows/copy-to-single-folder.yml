name: Copy Speed Stars 2 Port (Web Optimized)
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Speed Stars 2 source repository
        run: |
          git clone --depth 1 https://github.com/zz98006/speed-stars2 temp-repo

      - name: Move Assets to Target Location
        run: |
          mkdir -p games/speed-stars-2
          
          if [ -d "temp-repo/speed-stars" ]; then
            rsync -av --exclude='.git' temp-repo/speed-stars/ games/speed-stars-2/
          else
            rsync -av --exclude='.git' temp-repo/ games/speed-stars-2/
          fi

      - name: Remove Base Line in Index
        run: |
          INDEX_FILES=$(find games/speed-stars-2 -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/d' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/speed-stars-2!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          # Configured with the official GitHub Actions identity credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the new game files directly
          git add games/speed-stars-2/
          
          # Create the commit locally
          git commit -m "Imported Speed Stars 2 assets directly via standard web sync" || echo "No changes to commit"
          
          # Fetch remote changes and place our new commit cleanly at the front of the line
          git pull --rebase origin main
          
          # Push the files up so they appear instantly on your GitHub Web interface
          git push origin main
