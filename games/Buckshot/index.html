<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0 user-scalable=no">
	<title>Buckshot Roulette (GitHub Pages Split Loader)</title>
	
	<!-- Coi Service Worker handles the mandatory SharedArrayBuffer isolation on GitHub -->
	<script src="coi-serviceworker.js"></script>

	<style>
		body { touch-action: none; margin: 0; padding: 0; background-color: black; text-align: center; }
		#canvas { display: block; margin: 0 auto; color: white; }
		#canvas:focus { outline: none; }
		#status { position: absolute; left:0; top:0; right:0; bottom:0; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #f5f5f5; font-family: sans-serif; }
		.progress-bar { width: 300px; height: 10px; background-color: #333; margin-top: 10px; border-radius: 5px; overflow: hidden; }
		.progress-fill { width: 0%; height: 100%; background-color: #ff4500; transition: width 0.1s; }
	</style>
</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<div id="status">
		<div id="status-text">Downloading GitHub Fragments (0/39)...</div>
		<div class="progress-bar"><div id="progress-value" class="progress-fill"></div></div>
	</div>

	<!-- Step 1: Load the main Godot engine orchestration wrapper script -->
	<script src="GlitchesBuckshot-W-MPsupport.js"></script>
	
	<script>
		// Helper function to sequentially grab fragments and return a single unified Blob URL
		async function fetchAndAssembleBlob(baseName, totalParts, paddingLength, mimeType) {
			const partBlobs = [];
			
			for (let i = 1; i <= totalParts; i++) {
				const partNum = String(i).padStart(paddingLength, '0');
				const url = `${baseName}.part${partNum}`;
				
				document.getElementById('status-text').textContent = `Assembling: ${url}`;
				const response = await fetch(url);
				if (!response.ok) throw new Error(`Missing project fragment: ${url}`);
				
				const blobData = await response.blob();
				partBlobs.push(blobData);
				
				// Keep track of total progress bar allocation
				window.fragmentsLoaded++;
				const percent = Math.floor((window.fragmentsLoaded / 39) * 100);
				document.getElementById('progress-value').style.width = `${percent}%`;
			}
			
			// Combine the small blobs into a single massive browser-RAM Object URL
			return URL.createObjectURL(new Blob(partBlobs, { type: mimeType }));
		}

		async function launchGitHubBuild() {
			window.fragmentsLoaded = 0;
			try {
				// 1. Gather the 37 PCK parts and 2 WASM parts sequentially from GitHub
				const solidPckBlobUrl = await fetchAndAssembleBlob('GlitchesBuckshot-W-MPsupport.pck', 37, 2, 'application/octet-stream');
				const solidWasmBlobUrl = await fetchAndAssembleBlob('GlitchesBuckshot-W-MPsupport.wasm', 2, 1, 'application/wasm');

				document.getElementById('status-text').textContent = `Spawning Game Canvas...`;

				// 2. Set up the Configuration mapping to direct Godot straight to our combined local storage paths
				const GODOT_CONFIG = {
					"args": [],
					"canvasResizePolicy": 2,
					"executable": solidWasmBlobUrl, // Feeds the combined virtual file link straight to engine compilation
					"mainPack": solidPckBlobUrl,    // Feeds the combined asset bundle path cleanly
					"fileSizes": {}
				};

				// 3. Initiate the engine sequence 
				const engine = new Engine(GODOT_CONFIG);
				
				// Start the game!
				engine.startGame().then(() => {
					document.getElementById('status').style.display = 'none';
				}).catch((err) => {
					document.getElementById('status-text').textContent = "Initialization failed inside the canvas layer.";
					console.error(err);
				});

			} catch (err) {
				document.getElementById('status-text').textContent = "Failed to synchronize server components.";
				console.error(err);
			}
		}

		// Fire loader once the window environment has fully registered the script frameworks
		window.addEventListener('load', launchGitHubBuild);
	</script>
</body>
</html>
