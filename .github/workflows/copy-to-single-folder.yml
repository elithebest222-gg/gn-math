name: Copy Schoolboy Runaway Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Ensures LFS operational layers are active in workspace

      - name: Clone Schoolboy Runaway source repository
        run: |
          git clone --depth 1 https://github.com/giorgirick2-gif/game-webports-onawebsite temp-repo

      - name: Move Assets to Target Location
        run: |
          mkdir -p games/schoolboy-runaway
          
          if [ -d "temp-repo/schoolboy-runaway" ]; then
            rsync -av --exclude='.git' temp-repo/schoolboy-runaway/ games/schoolboy-runaway/
          else
            rsync -av --exclude='.git' temp-repo/ games/schoolboy-runaway/
          fi

      - name: Remove Base Line in Index
        run: |
          INDEX_FILES=$(find games/schoolboy-runaway -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/d' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/schoolboy-runaway!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely with LFS tracking
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Initialize Git LFS inside the runner local environment
          git lfs install
          
          # Track large compiled Unity binary files through LFS pointers
          git lfs track "games/schoolboy-runaway/Build/*.data"
          git lfs track "games/schoolboy-runaway/Build/*.wasm"
          git lfs track "games/schoolboy-runaway/Build/*.bundle"
          git lfs track "*.data"
          git lfs track "*.wasm"
          
          # Force save the tracking configuration rules (.gitattributes)
          git add .gitattributes
          
          # Index the rest of the game files
          git add games/schoolboy-runaway/
          
          git commit -m "Imported Schoolboy Runaway assets with active LFS file tracking" || echo "No changes to commit"
          
          # Synchronize and push changes up to GitHub remote streams
          git pull --rebase origin main
          git push origin main
