name: Copy Endacopia Game
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Endacopia source repository
        run: |
          git clone --depth 1 https://github.com/clever-portal/endacopia temp-repo

      - name: Verify and Move Game Engine Assets
        run: |
          # Create target folder structure
          mkdir -p games/endacopia
          
          # CRITICAL CHECK: Verify the key Adventure Game Studio files exist
          if [ ! -f "temp-repo/ags.wasm" ] || [ ! -f "temp-repo/index.html" ]; then
            echo "::error::Required AGS runtime files (ags.wasm or index.html) were not found in the source!"
            exit 1
          fi

          # Copy everything from the temporary folder over to the target directory
          cp -r temp-repo/* games/endacopia/
          
          # Remove Git metadata from the copied directory if any slipped through
          rm -rf games/endacopia/.git
          
          # Clean up the temporary workspace clone
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add games/endacopia/
          git commit -m "Successfully imported Endacopia AGS web assembly game files" || echo "No changes to commit"
          
          # Rebase onto your main branch to sync any concurrent repository modifications
          git pull --rebase origin main
          git push origin main
