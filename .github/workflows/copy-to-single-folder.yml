name: Copy Files Into Existing Folder
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone your source game repository
        run: |
          git clone --depth 1 https://github.com/elithebest222-gg/Buckshot-NEWEST-Port temp-game

      - name: Push files directly into your folder
        run: |
          mkdir -p games/Buckshot
          cp -r temp-game/* games/Buckshot/
          rm -rf temp-game

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games/Buckshot/
          git commit -m "Successfully moved all 37+ game files into games/Buckshot" || echo "No changes"
          git push
