name: Copy JSAB Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone JSAB source repository
        run: |
          # Clones the web-ports/jsab repository with minimal history
          git clone --depth 1 https://github.com/web-ports/jsab temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/jsab
          
          # This repository stores files in its root directory, so we copy everything
          if [ -d "temp-repo" ]; then
            rsync -av --exclude='.git' temp-repo/ games/jsab/
          else
            echo "::error::Source repository folder temp-repo not found!"
            exit 1
          fi

      - name: Remove Base Line in Index (Case Insensitive)
        run: |
          INDEX_FILES=$(find games/jsab -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/Id' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/jsab!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage and commit the new game assets
          git add games/jsab/
          git commit -m "Imported JSAB web assets directly via standard web sync" || echo "No changes to commit"
          
          git pull --rebase origin main
          git push origin main
