name: Copy Spaceflight Simulator Game
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone the Spaceflight Simulator port repository
        run: |
          # Shallow clone the repository to quickly download files
          git clone --depth 1 https://github.com/web-ports/spaceflight-simulator temp-repo

      - name: Verify and Move Spaceflight Simulator Build Assets
        run: |
          # Create target directory
          mkdir -p games/spaceflight-simulator
          
          # CRITICAL CHECK: Verify all essential folders and index.html exist
          if [ ! -d "temp-repo/Build" ] || [ ! -d "temp-repo/TemplateData" ] || [ ! -d "temp-repo/StreamingAssets" ] || [ ! -f "temp-repo/index.html" ]; then
            echo "::error::Required assets (/Build, /TemplateData, /StreamingAssets, or index.html) were not found in the source!"
            exit 1
          fi

          # Explicitly copy the core game build engine, templates, and streaming assets
          cp -r temp-repo/Build/ games/spaceflight-simulator/Build/
          cp -r temp-repo/TemplateData/ games/spaceflight-simulator/TemplateData/
          cp -r temp-repo/StreamingAssets/ games/spaceflight-simulator/StreamingAssets/
          cp temp-repo/index.html games/spaceflight-simulator/index.html
          
          # Clean hardcoded base elements if they exist to prevent asset loading breaks
          if [ -f games/spaceflight-simulator/index.html ]; then
            sed -i '/<base href=/d' games/spaceflight-simulator/index.html
          fi
          
          # Clean up temp working repository
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add games/spaceflight-simulator/
          git commit -m "Successfully imported Spaceflight Simulator assets including StreamingAssets" || echo "No changes to commit"
          
          # Rebase onto your main branch to sync any incoming commits
          git pull --rebase origin main
          git push origin main
