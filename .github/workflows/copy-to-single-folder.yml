name: Copy Speed Stars
on:
  workflow_dispatch: # This adds the manual "Run" button

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history to prevent branch push conflicts

      - name: Clone source web-port repository
        run: |
          git clone --depth 1 https://github.com/genizy/web-port/tree/main/speed-stars temp-repo

      - name: Move Speed Stars and clean CDN tags
        run: |
          # Create your targeted folder path
          mkdir -p games/speed-stars
          
          # Move only the speed-stars files over
          cp -r temp-repo/speed-stars/* games/speed-stars/
          
          # Automatically strip out any problematic CDN base href line from index.html
          if [ -f games/speed-stars/index.html ]; then
            sed -i '/<base href=/d' games/speed-stars/index.html
          fi
          
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games/speed-stars/
          git commit -m "Successfully imported Speed Stars and stripped CDN paths" || echo "No changes"
          
          # Sync right before uploading to bypass remote block issues
          git pull --rebase origin main
          git push origin main
