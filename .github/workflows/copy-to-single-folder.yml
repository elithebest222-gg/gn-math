name: Copy Speed Stars
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone only the speed-stars subfolder
        run: |
          # Use sparse-checkout parameters to download just the targeted directory
          git clone --depth 1 --filter=blob:none --sparse https://github.com/genizy/web-port temp-repo
          git -C temp-repo sparse-checkout set speed-stars

      - name: Move Speed Stars and clean CDN tags
        run: |
          mkdir -p games/speed-stars
          
          # Move files from the sparse subdirectory structure over
          cp -r temp-repo/speed-stars/* games/speed-stars/
          
          if [ -f games/speed-stars/index.html ]; then
            sed -i '/<base href=/d' games/speed-stars/index.html
          fi
          
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games/speed-stars/
          git commit -m "Successfully imported Speed Stars subfolder" || echo "No changes"
          
          git pull --rebase origin main
          git push origin main
