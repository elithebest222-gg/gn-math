<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geography - GN-MATH</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-color: #c5a059;
            --text-muted: #8b949e;
            --accent-color: #66fcf1;
            --tag-bg: #2d3748;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .filter-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            text-transform: lowercase;
            transition: all 0.2s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }

        /* Game Grid Layout */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            padding: 20px 0;
        }

        /* Game Cards */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: var(--text-color);
            box-shadow: 0 8px 20px rgba(197, 160, 89, 0.15);
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16/10;
            background: #121821;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .game-card:hover .thumbnail-container img {
            transform: scale(1.05);
        }

        .thumbnail-fallback {
            position: absolute;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            padding: 10px;
            z-index: 1;
        }

        .game-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            background: var(--card-bg);
            z-index: 2;
        }

        .game-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-meta {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .game-tag {
            background: var(--tag-bg);
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .loading-status {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Geography - Truffled</h1>
        <div class="filter-nav">
            <button class="filter-btn active">all</button>
            <button class="filter-btn">games</button>
            <button class="filter-btn">proxied games</button>
        </div>
    </header>

    <main class="games-grid" id="gamesGrid">
        <div class="loading-status" id="loadingStatus">Loading games...</div>
    </main>

    <script>
        // ADD YOUR NEW GAME FOLDER NAMES TO THIS ARRAY
        const gameFolders = [
            "fish",
            "christmas-massacre",
            "clover-pit",
            "needy-streamer-overload",
            "tabs",
            "spaceflight-simulator"
        ];

        // Clean names up for readable text and clean image search queries
        function formatGameTitle(slug) {
            if (slug === 'tabs') return 'Totally Accurate Battle Simulator';
            return slug
                .split('-')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function loadGames() {
            const grid = document.getElementById('gamesGrid');
            const status = document.getElementById('loadingStatus');
            
            if (status) status.remove();

            if (gameFolders.length === 0) {
                grid.innerHTML = '<div class="loading-status">No games found.</div>';
                return;
            }

            gameFolders.forEach(folder => {
                const cleanTitle = formatGameTitle(folder);
                const gamePath = `games/${folder}/index.html`;
                
                // Encode title to safely use it inside the automated image search URL
                const searchName = encodeURIComponent(cleanTitle);
                const autoCoverUrl = `https://weserv.nl{searchName}`;

                const card = document.createElement('a');
                card.href = gamePath;
                card.className = 'game-card';

                // Setting up layout with an image loader that updates dynamically based on the game folder
                card.innerHTML = `
                    <div class="thumbnail-container">
                        <div class="thumbnail-fallback">${cleanTitle}</div>
                        <img src="https://screenshotmachine.com{window.location.origin}/games/${folder}/index.html&dimension=1024x768" 
                             onerror="this.src='https://microlink.io{searchName}&embed=screenshot.url&overlay.browser=dark'"
                             alt="${cleanTitle} Cover Art" 
                             style="position: relative; z-index: 2;">
                    </div>
                    <div class="game-info">
                        <h2 class="game-title">${cleanTitle}</h2>
                        <div class="game-meta">
                            <span class="game-tag">game</span>
                        </div>
                    </div>
                `;

                // If specialized live snapshot engines fail or take time to populate, use a reliable backup layout
                const imgElement = card.querySelector('img');
                imgElement.onerror = function() {
                    this.src = `https://unsplash.com`;
                };

                grid.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', loadGames);
    </script>
</body>
</html>
