name: Copy Hollow Knight
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history to allow clean merging

      - name: Clone Hollow Knight repository
        run: |
          git clone --depth 1 https://github.com/elithebest222-gg/hollow-knight/ temp-game

      - name: Move files directly into games/hollow-knight
        run: |
          mkdir -p games/hollow-knight
          cp -r temp-game/* games/hollow-knight/
          rm -rf temp-game

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games/hollow-knight/
          git commit -m "Successfully imported Hollow Knight webport assets" || echo "No changes"
          
          # This forces a quick sync right before uploading to bypass the lock error
          git pull --rebase origin main
          git push origin main
