name: Copy 60 Seconds Web Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone 60 Seconds source repository
        run: |
          git clone --depth 1 https://github.com/usheje883-maker/60-Seconds-Webport temp-repo

      - name: Verify and Move Unity WebGL Assets
        run: |
          # Create destination directory structure
          mkdir -p games/60-seconds
          
          # CRITICAL CHECK: Verify Unity WebGL core compilation directories exist
          if [ ! -d "temp-repo/Build" ] || [ ! -d "temp-repo/TemplateData" ] || [ ! -f "temp-repo/index.html" ]; then
            echo "::error::Core Unity compilation assets (Build/, TemplateData/, or index.html) were not found in the source!"
            exit 1
          fi

          # Copy Unity WebGL build folders, streaming assets, and web layout indexes
          cp -r temp-repo/* games/60-seconds/
          
          # Remove Git metadata from the copied directory if any slipped through
          rm -rf games/60-seconds/.git
          
          # Clean up the temporary workspace clone
          rm -rf temp-repo

      - name: Remove Base Line in Index
        run: |
          TARGET_INDEX="games/60-seconds/index.html"
          
          # Remove any line containing the <base href... tag completely
          if [ -f "$TARGET_INDEX" ]; then
            sed -i '/<base href=/d' "$TARGET_INDEX"
            echo "Successfully removed base href tags from $TARGET_INDEX"
          else
            echo "::warning::index.html not found, skipping base tag removal."
          fi

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add games/60-seconds/
          git commit -m "Imported 60 Seconds web port and stripped base line from index.html" || echo "No changes to commit"
          
          # Rebase onto your main branch to sync any concurrent repository modifications
          git pull --rebase origin main
          git push origin main
