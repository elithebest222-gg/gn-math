<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | WhosYourDaddy</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        width: 100%;
        background: black;
      }

      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #231F20;
      }

      #loading-text {
        font-weight: bold;
        background: linear-gradient(
          270deg,
          #ff0000,
          #ff7f00,
          #ffff00,
          #00ff00,
          #0000ff,
          #4b0082,
          #8f00ff
        );
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
      }

      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING... 0 MB / 0 MB</div>
    <canvas id="unity-canvas" tabindex="-1" style="background: #231F20"></canvas>
    <script src="Build/daddyreeyuki.loader.js"></script>
    <script>
    var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    // Hardcode your approximate target file size here in bytes (e.g., 120.36 MB = 126207078 bytes)
    // If your build is larger or scales into GBs, adjust this number accordingly.
    const ESTIMATED_TOTAL_BYTES = 126207078; 

    // Helper function to format bytes nicely into MB or GB
    function formatBytes(bytes) {
      if (bytes === 0) return "0 MB";
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      // Force scaling to start at MB (index 2) even for small initial chunks
      const unitIndex = Math.max(2, i); 
      const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
      const value = (bytes / Math.pow(1024, unitIndex)).toFixed(2);
      return `${value} ${sizes[unitIndex]}`;
    }

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        
        // Render dynamically using human-readable MB / GB formats
        let formattedDone = formatBytes(loadedBytes);
        let formattedTotal = formatBytes(ESTIMATED_TOTAL_BYTES);
        
        loadingText.textContent = `LOADING... ${formattedDone} / ${formattedTotal}`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("gash-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(getParts("Build/daddyreeyuki.data", 1, 5), "daddyreeyuki.data"),
        mergeFiles(getParts("Build/daddyreeyuki.wasm", 1, 3), "daddyreeyuki.wasm")
      ]);
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: dataUrl,
        frameworkUrl: "Build/daddyreeyuki.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Joe Williams",
        productName: "WhosYourDaddy",
        productVersion: "1.0",
      }).then(unityInstance => {
        loadingText.remove();
      }).catch(message => {
        alert(message);
      });
    })();
    </script>
  </body>
</html>
