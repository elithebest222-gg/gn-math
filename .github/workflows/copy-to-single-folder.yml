name: Copy BuildNow GG Game
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone the BuildNow GG directory using sparse checkout
        run: |
          mkdir temp-repo && cd temp-repo
          git init
          git remote add origin https://github.com/genizy/cg-rip/
          git config core.sparseCheckout true
          
          # Target only the buildnow-gg folder
          echo "buildnow-gg/" >> .git/info/sparse-checkout
          
          git pull --depth 1 origin main
          cd ..

      - name: Verify and Move Assets
        run: |
          # Create target directory
          mkdir -p games/buildnow-gg
          
          # CRITICAL CHECK: Verify core engine folder and entry index exist
          if [ ! -d "temp-repo/buildnow-gg/Build" ] || [ ! -f "temp-repo/buildnow-gg/index.html" ]; then
            echo "::error::Required assets (/Build or index.html) were not found in the source!"
            exit 1
          fi

          # Recursively copy all contents (Build/, index.html, cg-sdk.js)
          cp -r temp-repo/buildnow-gg/* games/buildnow-gg/
          
          # Clean hardcoded base elements if they exist to prevent asset loading breaks
          if [ -f games/buildnow-gg/index.html ]; then
            sed -i '/<base href=/d' games/buildnow-gg/index.html
            echo "Successfully cleaned base href tags from entry index."
          fi
          
          # Clean up temp working repository
          rm -rf temp-repo

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add games/buildnow-gg/
          git commit -m "Successfully imported BuildNow GG assets including core Build engine" || echo "No changes to commit"
          
          # Rebase onto your main branch to sync any incoming commits
          git pull --rebase origin main
          git push origin main
