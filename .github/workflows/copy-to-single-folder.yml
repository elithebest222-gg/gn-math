name: Copy Hollow Knight Webport
on:
  workflow_dispatch: # Adds the manual "Run" button

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Clone the Hollow Knight repository
        run: |
          git clone --depth 1 https://github.com/elithebest222-gg/hollow-knight temp-game

      - name: Push files directly into games/hollow-knight
        run: |
          # Create the game folder structure
          mkdir -p games/hollow-knight
          
          # Copy all folders and files over
          cp -r temp-game/* games/hollow-knight/
          rm -rf temp-game

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add games/hollow-knight/
          git commit -m "Successfully imported Hollow Knight webport assets" || echo "No changes to commit"
          git push
