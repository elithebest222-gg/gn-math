name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # === DEBUG STEP: This will list your subfolder sizes ===
      - name: Debug folder sizes
        run: |
          echo "=== Top level sizes ==="
          du -h --max-depth=1 . | sort -h
          
          echo "=== Inspecting project subfolders ==="
          du -h --max-depth=2 . | sort -h | tail -n 20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Change '.' to './dist' or './public' if your build output is in a subfolder
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
