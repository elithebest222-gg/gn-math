name: Copy Schoolboy Runaway Port (Genizy Source)
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Genizy web-port source repository
        run: |
          # Clones the parent repository with minimal history depth to save bandwidth
          git clone --depth 1 https://github.com/genizy/web-port temp-repo

      - name: Move Assets to Target Location
        run: |
          # Setup destination root structure
          mkdir -p games/schoolboy-runaway
          
          # Isolate and migrate just the schoolboy-runaway subdirectory assets
          if [ -d "temp-repo/schoolboy-runaway" ]; then
            rsync -av --exclude='.git' temp-repo/schoolboy-runaway/ games/schoolboy-runaway/
          else
            rsync -av --exclude='.git' temp-repo/ games/schoolboy-runaway/
          fi

      - name: Remove Base Line in Index
        run: |
          INDEX_FILES=$(find games/schoolboy-runaway -iname "index.html")
          
          if [ -n "$INDEX_FILES" ]; then
            for file in $INDEX_FILES; do
              echo "Processing base href removal for: $file"
              sed -i '/<base href=/d' "$file"
            done
            echo "Successfully completed base href sanitization."
          else
            echo "::error::No index.html file found anywhere in games/schoolboy-runaway!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          # Configured with the official GitHub Actions identity credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the new game files directly
          git add games/schoolboy-runaway/
          
          # Create the commit locally
          git commit -m "Imported Schoolboy Runaway assets directly via standard web sync" || echo "No changes to commit"
          
          # Fetch remote changes and place our new commit cleanly at the front of the line
          git pull --rebase origin main
          
          # Push the files up so they appear instantly on your GitHub Web interface
          git push origin main
